name: TIC Japan Market Brief
on:
  schedule:
    - cron: '0 10,22 * * *'
  workflow_dispatch:
    inputs:
      send:
        description: Kirim ke Discord (matikan untuk preview)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - if: github.event_name == 'workflow_dispatch' && !inputs.send
        run: python brief.py
      - if: github.event_name == 'schedule' || inputs.send
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python brief.py --send
